version: '3.9'

services:
  web:
    build: .
    command: gunicorn trezo_site.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "changeme"

      # Настройки БД для Django
      POSTGRES_ENGINE: django.db.backends.postgresql
      POSTGRES_DB: user_bd
      POSTGRES_USER: user_bd
      POSTGRES_PASSWORD: user123968
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

      # Эти переменные подхватывает стартовый скрипт "Waiting for PostgreSQL ..."
      SQL_HOST: db
      SQL_PORT: "5432"
      SQL_USER: user_bd
      SQL_PASSWORD: user123968
      SQL_DATABASE: user_bd

      DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1 [::1]"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_bd
      POSTGRES_USER: user_bd
      POSTGRES_PASSWORD: user123968
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: