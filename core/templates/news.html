{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Инструкции по пользованию — Trezo</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <link rel="stylesheet" href="{% static 'css/modal.css' %}">
  <script>
    (function(){
      try {
        var authed = !!localStorage.getItem('authProfileKey');
        var root = document.documentElement;
        root.classList.add(authed ? 'news-authed' : 'news-guest');
        window.__newsAuthed = authed;
        document.title = (authed ? 'Техническая информация' : 'Инструкции по пользованию') + ' — Trezo';
      } catch (e) {
        document.documentElement.classList.add('news-guest');
        window.__newsAuthed = false;
        document.title = 'Инструкции по пользованию — Trezo';
      }
    })();
  </script>
</head>
<body class="news-page">
  <aside class="sidebar">
    <div class="logo">TREZO</div>
    <nav class="side-nav">
      <div class="side-nav-footer">
        {% include 'includes/side_nav_links.html' with current_section='news' %}
      </div>
    </nav>
  </aside>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo-wrap">
        <span class="page-title" data-page-title>Инструкции по пользованию</span>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button class="login-btn" type="button" data-open-auth>Войти / Регистрация</button>
      </div>
    </div>
  </header>

  <main class="main">
    <a class="news-back-btn" href="index.html" data-news-back hidden>Назад</a>
    <section class="news-list" id="newsList"></section>
  </main>

  <div id="authModal" class="modal">
    <div class="modal-content">
      <div class="tabs">
        <button class="tab active" data-tab="login">Войти</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>
      <div class="tab-content active" id="login">
        <input type="text" id="loginUser" placeholder="Логин">
        <small id="loginAuthError" class="error"></small>
        <input type="password" id="loginPass" placeholder="Пароль">
        <button class="btn">Войти</button>
      </div>
      <div class="tab-content" id="register">
        <input type="text" id="regLogin" placeholder="Логин">
        <small id="loginError" class="error"></small>
        <input type="password" id="regPass" placeholder="Пароль">
        <input type="password" id="regPass2" placeholder="Повторите пароль">
        <small id="passError" class="error"></small>
        <input type="text" placeholder="Телефон или Email">
        <button class="btn">Отправить код</button>

        <div id="codeSection" class="code-section hidden">
          <div class="code-container">
            <input type="text" maxlength="1" class="code-input">
            <input type="text" maxlength="1" class="code-input">
            <input type="text" maxlength="1" class="code-input">
            <input type="text" maxlength="1" class="code-input">
            <input type="text" maxlength="1" class="code-input">
            <input type="text" maxlength="1" class="code-input">
          </div>
          <small id="codeError" class="field-error"></small>
        </div>

        <div class="modal-footer">
          <button id="registerSubmit" type="button" class="btn ios-button">Зарегистрироваться</button>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'js/nav.js' %}"></script>
  <script src="{% static 'js/modal.js' %}"></script>
  <script src="{% static 'js/script.js' %}"></script>
  <script src="{% static 'js/prefs.js' %}"></script>
</body>
</html>
